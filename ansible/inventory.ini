# =============================================================================
# ReliefSync Ansible Inventory
# =============================================================================
# Target nodes for the Disaster Relief Volunteer Platform
#
# Usage:
#   ansible-playbook -i inventory.ini playbook.yml
#
# For local testing (Vagrant, WSL, or a test VM), update the IP address below.
# For production, replace with actual server IPs or hostnames.
# =============================================================================

[reliefsync_servers]
reliefsync-node1  ansible_host=192.168.56.10  ansible_user=deploy  ansible_ssh_private_key_file=~/.ssh/id_rsa

[reliefsync_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# --- Application Settings ---
app_name=reliefsync
app_user=reliefsync
app_group=reliefsync
app_uid=1500
app_home=/opt/reliefsync
app_repo=https://github.com/aravsm/ReliefSync.git
app_branch=main
app_port=5001
deploy_env=production

# --- MongoDB Settings ---
mongodb_version=7.0
mongodb_port=27017
mongodb_bind_ip=127.0.0.1
mongodb_db_name=reliefsync

# --- Node.js Settings ---
nodejs_version=20

# --- Nginx Settings ---
nginx_server_name=reliefsync.local

# --- Docker Settings ---
docker_users=reliefsync,deploy

# --- Firewall Settings ---
firewall_allowed_ports=[22, 80, 443, 3000]
